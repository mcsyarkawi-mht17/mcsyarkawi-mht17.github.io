<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cover — Click to Register</title>
  <style>
    html,body { height:100%; margin:0; }
    .cover {
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      background:#000;
    }
    .cover img {
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      cursor:pointer;
      display:block;
    }
    .cta {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background:#ff6f61;
      color:#fff;
      padding:12px 20px;
      border-radius:6px;
      font-weight:600;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="cover">
    <!-- Clicking image or button goes to registration.html -->
    <a href="registration.html" title="Open registration portal" aria-label="Open registration portal">
      <img src="https://i.imgur.com/btqDqGh.jpeg" alt="SAT preparation poster — click to register" />
    </a>

    <!-- Optional visible button (same link) -->
    <a class="cta" href="registration.html" role="button">Register Now</a>
  </div>
</body>
</html>
